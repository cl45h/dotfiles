# picom (fork pijulius, base picom 12): sintaxis nueva de animaciones + rules.
# Look inspirado en 43PR/dotfiles (Hyprland): 90 % de opacidad, blur, esquinas 8,
# sombra corta, animaciones easeOut. Backup previo en ~/.local/src/backups/.

# Backend
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

# Sombras (43PR: range 4, suaves y cortas)
shadow = true;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.45;
shadow-color = "#1e1e2e";

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Opacidad: se maneja por completo en `rules` (con rules, active/inactive-opacity se ignoran)
frame-opacity = 1.0;

# Blur detrás de todo lo translúcido (43PR: size 5, passes 1)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;

# Esquinas (43PR: rounding 8)
corner-radius = 8;

# Animaciones globales. Curva easeOut de 43PR: cubic-bezier(0.05, 0.9, 0.1, 1.0)
animations = (
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "linear";
      duration = 0.25;
      start = "window-raw-opacity-before";
      end = "window-raw-opacity";
    };
    blur-opacity = {
      curve = "linear";
      duration = 0.15;
      delay = 0.2;
      start = "window-raw-opacity-before";
      end = "window-raw-opacity";
    };
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)";
      duration = 0.4;
      start = 0.8;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "linear";
      duration = 0.2;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)";
      duration = 0.25;
      start = 1;
      end = 0.9;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    # ventanas que se mueven o redimensionan (layout, mfact, cambio de tag). Slide + fade:
    # dwm estaciona las ocultas con 1 px en pantalla y la ultima regla las pone a opacidad 0,
    # asi este script interpola posicion y opacidad (el slidefadevert de Hyprland).
    # Ojo: el trigger "geometry" NO existe en este fork, hay que usar position/size.
    triggers = ["position", "size"];
    scale-x = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)"; duration = 0.4; start = "window-width-before / window-width"; end = 1; };
    scale-y = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)"; duration = 0.4; start = "window-height-before / window-height"; end = 1; };
    offset-x = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)"; duration = 0.4; start = "window-x-before - window-x"; end = 0; };
    offset-y = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)"; duration = 0.4; start = "window-y-before - window-y"; end = 0; };
    opacity = { curve = "linear"; duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
    # en un resize, funde el contenido viejo con el nuevo (como el preset geometry-change)
    saved-image-blend = { duration = 0.4; start = 1; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  }
);

# Reglas por ventana. Se evalúan en orden y la última que fija una opción gana.
rules = (
  # base 43PR: todo al 90 %
  { opacity = 0.9; },

  # st maneja su propio alpha de fondo: con foco opaco, sin foco 90 %
  { match = "class_g = 'st-256color' && focused";  opacity = 1; },
  { match = "class_g = 'st-256color' && !focused"; opacity = 0.9; },

  # video, navegadores y chat: opacos (como lo tenías)
  { match = "class_g = 'waterfox' || class_g = 'Chromium' || class_g = 'discord' || class_g = 'Stremio' || class_g = 'TelegramDesktop'"; opacity = 1; },

  # barra de dwm y dmenu: sin esquinas ni blur, la barra opaca
  { match = "class_g = 'dwm'";   corner-radius = 0; opacity = 1; blur-background = false; shadow = false; },
  { match = "class_g = 'dmenu'"; corner-radius = 0; },

  # pantalla completa: opaca, sin esquinas ni sombra, solo fade
  {
    match = "fullscreen";
    opacity = 1; corner-radius = 0; shadow = false;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.2; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.2; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    );
  },

  # menús desplegables y tooltips: despliegue corto desde arriba
  {
    match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'menu' || window_type = 'tooltip' || window_type = 'combo'";
    corner-radius = 6; shadow = false;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.12; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.0)"; duration = 0.15; start = 0.85; end = 1; };
        shadow-scale-y = "scale-y"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.1; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    );
  },

  # notificaciones de dunst: solo fade (43PR: 200 ms), esquinas como las dibuja dunst
  {
    match = "window_type = 'notification' || class_g = 'Dunst'";
    corner-radius = 16;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.2; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.2; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    );
  },

  # popups propios (volumen, calendario): píldora, fade + escala 0.9 -> 1 en 150 ms (OSD de 43PR)
  {
    match = "name = 'volume-popup' || name = 'calendar-popup'";
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.15; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.33, 1, 0.68, 1)"; duration = 0.15; start = 0.9; end = 1; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.32, 0, 0.67, 0)"; duration = 0.12; start = 1; end = 0.9; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; }
    );
  },
  { match = "name = 'volume-popup'"; corner-radius = 19; },

  # OSD de volumen (volume-osd, GTK con esquinas propias): sin radio/sombra/blur de picom, fade + escala
  {
    match = "name = 'volume-osd' || class_g = 'volume-osd'";
    corner-radius = 0; shadow = false; blur-background = false; opacity = 1;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.15; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.33, 1, 0.68, 1)"; duration = 0.15; start = 0.9; end = 1; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    );
  },

  # estacionadas por dwm (showhide): 1 px visible arriba o abajo de la pantalla -> invisibles
  { match = "y2 <= 2 || y >= 1079"; opacity = 0; }
);
